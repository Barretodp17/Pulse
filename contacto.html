<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse</title>
    <link rel="shortcut icon" href="assets/logo--.png" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="contacto-header">
        <a href="index.html">
            <img src="assets/logo.png" alt="Logo Pulse">
        </a>
        <h1>Contacto</h1>
    </header>
    <!--CONTENIDO PRINCIPAL-->
    <main class="contacto">
        <section class="contacto-mapa">
            <h2>Encontranos</h2>
            <p>Podes encontrarnos en nuestras oficinas</p>
            <div class="mapa">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.2006427724614!2d-58.38877862494385!3d-34.5990875572525!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccb0a7d71cf13%3A0xbfd5f7d125146979!2sCoreworks%20Coworking%20Barrio%20Norte!5e0!3m2!1ses-419!2sar!4v1790781156475!5m2!1ses-419!2sar"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>
        <!--FORMULARIO-->
        <section class="contacto-formulario">
            <h2>¿Tenes alguna consulta?</h2>
            <p>Completá el formulario y nos pondremos en contacto </p>

            <form action="#" method="post">
                <!--nombre-->
                <div class="campo">
                    <label for="nombre">Nombre</label>
                    <input type="text" name="nombre" id="nombre" placeholder="Ingresá tu nombre" required>
                </div>
                <!--email-->
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" name="email" id="email" placeholder="Ingreá tu correo electrónico" required>
                </div>
                <!--asunto-->
                <div class="campo">
                    <label for="asunto">Asunto</label>
                    <input type="text" name="asunto" id="asunto" placeholder="¿Sobre qué es tu consulta?" required>
                </div>
                <!--mensaje-->
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea name="mensaje" id="mensaje" rows="6" placeholder="Escribí tu consulta"
                        required></textarea>
                </div>
                <!--boton-->
                <button type="submit" class="contacto-boton" id="boton-contacto">
                    Enviar consulta
                </button>
            </form>
        </section>
        <!--VOLVER A INICIO-->
        <a href="index.html" class="inicio">
            ⟵ Volver al inicio
        </a>
    </main>
</body>

</html>
